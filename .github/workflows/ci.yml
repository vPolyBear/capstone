name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [us/kspencer/WeekOneInitialSetup]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install from the lock file
        run: ./script/setup

      - name: Lint
        run: ./script/lint

      - name: Test
        run: ./script/test

      - name: Build
        run: ./script/build

  smoke:
    name: sqlite-smoke-test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install from the lock file
        run: npm ci

      - name: Create and seed temporary SQLite database
        run: |
          mkdir -p Documents/SQLite

          node --input-type=module <<'NODE'
          import { DatabaseSync } from 'node:sqlite';
          import { DEVELOPMENT_SEED_SQL } from './src/lib/developmentSeed.js';

          const db = new DatabaseSync('Documents/SQLite/smoke.db');

          try {
            db.exec(`
              CREATE TABLE schema_migrations (
                version INTEGER PRIMARY KEY
              );

              INSERT INTO schema_migrations VALUES (1), (2);

              CREATE TABLE check_ins (
                date TEXT,
                stress_level INTEGER,
                mood TEXT,
                eaten_recently INTEGER,
                concentration_level INTEGER
              );
            `);

            db.exec(DEVELOPMENT_SEED_SQL);

            console.log('Development seed executed successfully.');
          } finally {
            db.close();
          }
          NODE

      - name: Smoke test SQLite
        run: bash ./script/smoke
        env:
          SMOKE_DATABASE_PATH: Documents/SQLite/smoke.db
          SMOKE_EXPECT: calm

